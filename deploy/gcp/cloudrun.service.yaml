# gcloud run services replace deploy/gcp/cloudrun.service.yaml --region asia-northeast3
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: harbinger-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: asia-northeast3-docker.pkg.dev/PROJECT_ID/harbinger/api:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: HARBINGER_DEMO_BOOTSTRAP, value: "1" }
            - { name: HARBINGER_LOG_LEVEL, value: INFO }
            # 운영: 번들을 GCS 에서 받아 /app/models 에 두는 init 단계를 두고 DEMO_BOOTSTRAP=0
          resources:
            limits: { cpu: "2", memory: 2Gi }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 30

name: pages
on:
  push:
    branches: [main]
    paths:
      - "docs/demo/**"
      - ".github/workflows/pages.yml"
      - "scripts/check_browser.py"
      - "scripts/check_mobile_filters.py"
      - "scripts/record_workbench.py"
      - "scripts/check_public_demo.py"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify saved demo and record an 80-second walkthrough
        run: |
          bash scripts/configure_ci_apt.sh
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install playwright
          playwright install --with-deps chromium
          python -m http.server 8020 --directory docs/demo > /tmp/static-server.txt 2>&1 &
          python scripts/check_browser.py --static --url http://127.0.0.1:8020/ --out /tmp/static-browser
          mkdir -p docs/demo/mobile-captures
          cp /tmp/static-browser/mobile-filter-*.png /tmp/static-browser/mobile-reasons.png /tmp/static-browser/mobile-detail.png docs/demo/mobile-captures/
          python scripts/record_workbench.py --url http://127.0.0.1:8020/ --out /tmp/walkthrough
          VIDEO=$(python -c "import json; print(json.load(open('/tmp/walkthrough/recording.json'))['raw_video'])")
          ffmpeg -y -i "$VIDEO" -vf scale=1280:-2 -c:v libx264 -crf 26 -pix_fmt yuv420p -movflags +faststart docs/demo/walkthrough.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 docs/demo/walkthrough.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-demo-verification
          path: |
            /tmp/static-browser
            /tmp/walkthrough
            docs/demo/walkthrough.mp4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Check public assets and model version
        run: python scripts/check_public_demo.py --url '${{ steps.deploy.outputs.page_url }}'

      - name: Verify public AWS entry and recorded video
        env:
          DEMO_BASE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib,os,time,urllib.request
          from pathlib import Path
          base=os.environ['DEMO_BASE_URL'].rstrip('/')+'/'
          for name in ['live.html','aws-checks.mp4']:
              expected=hashlib.sha256((Path('docs/demo')/name).read_bytes()).hexdigest()
              for attempt in range(20):
                  try:
                      with urllib.request.urlopen(base+name+'?aws-evidence=20261024',timeout=15) as response:
                          actual=hashlib.sha256(response.read()).hexdigest()
                      assert actual==expected
                      print('Public file SHA-256 matches:',base+name)
                      break
                  except (OSError,AssertionError):
                      if attempt==19:
                          raise
                      time.sleep(5)
          with urllib.request.urlopen('https://13.236.137.0/health',timeout=20) as response:
              assert response.status==200
          print('AWS public HTTPS health also passed.')
          PY

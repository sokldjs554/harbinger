name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          pip install -c constraints.txt -e ".[dev]"
          pip install 'playwright==1.56.0'
          bash scripts/configure_ci_apt.sh
          playwright install --with-deps chromium
      - name: Lint
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Tests
        run: pytest -q
      - name: Monitoring rule syntax and firing/recovery
        run: bash scripts/check_monitoring.sh /tmp/hb-monitoring-bin
      - name: Smoke pipeline (tiny synthetic → features → eval → API)
        run: |
          harbinger synth --out /tmp/hb/data --scale 0.15 --months 12 --seed 7
          harbinger features --data /tmp/hb/data
          harbinger eval --data /tmp/hb/data --models /tmp/hb/models --artifacts /tmp/hb/artifacts --quick --skip-loso
          HARBINGER_DATA_DIR=/tmp/hb/data HARBINGER_MODEL_DIR=/tmp/hb/models HARBINGER_ARTIFACT_DIR=/tmp/hb/artifacts HARBINGER_DEMO_BOOTSTRAP=0 \
            python -c "from fastapi.testclient import TestClient; from harbinger.api.main import app; c=TestClient(app); c.__enter__(); r=c.get('/v1/sites'); assert r.status_code==200, r.text; s=r.json()['sites'][0]['site_id']; assert c.get(f'/v1/sites/{s}/patrol/today').status_code==200; assert c.get(f'/v1/sites/{s}/report?format=md').status_code==200; print('api smoke ok')"
      - name: Browser interactions (actual tiny model API)
        run: |
          HARBINGER_DATA_DIR=/tmp/hb/data HARBINGER_MODEL_DIR=/tmp/hb/models HARBINGER_ARTIFACT_DIR=/tmp/hb/artifacts HARBINGER_DEMO_BOOTSTRAP=0 uvicorn harbinger.api.main:app --port 8000 > /tmp/browser-server.txt 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          python scripts/check_browser.py --out /tmp/browser-checks
          python scripts/check_energy_browser.py --url http://127.0.0.1:8000/console/advanced.html#energy --out /tmp/energy-browser
      - name: Local main-path load and real Prometheus firing/recovery
        run: |
          python -m scripts.check_local_operations --runtime /tmp/hb --prometheus /tmp/hb-monitoring-bin/prometheus --out /tmp/local-operations
      - name: Protected API and separate-user browser checks
        run: |
          python -m scripts.check_protected_stack --data /tmp/hb/data --models /tmp/hb/models --artifacts /tmp/hb/artifacts --out /tmp/protected-checks
      - name: Browser interactions (saved demo and mobile filters)
        run: |
          python -m http.server 8020 --directory docs/demo > /tmp/static-server.txt 2>&1 &
          python scripts/check_browser.py --static --url http://127.0.0.1:8020/ --out /tmp/static-mobile
          python -m scripts.check_policy_display --url http://127.0.0.1:8020/ --out /tmp/policy-display
          python -m scripts.check_retest --url http://127.0.0.1:8020/retest.html --out /tmp/retest-recorder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            /tmp/browser-checks
            /tmp/static-mobile
            /tmp/policy-display
            /tmp/retest-recorder
            /tmp/protected-checks
            /tmp/energy-browser
            /tmp/local-operations/*.json
            /tmp/local-operations/*.yml
            /tmp/local-operations/*.log
            /tmp/local-operations/metrics.txt
            /tmp/local-operations/workload.csv
      - name: Docs numbers match artifacts
        run: |
          python scripts/fill_numbers.py --check
          python scripts/release_manifest.py --check
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: harbinger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Container runtime and API
        run: |
          docker run -d --name hb-ci --cpus=2 --memory=2g -p 127.0.0.1:18002:8000 -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 harbinger:ci
          for i in $(seq 1 180); do curl -fsS http://127.0.0.1:18002/health && break || sleep 5; done
          curl -fsS http://127.0.0.1:18002/health
          curl -fsS http://127.0.0.1:18002/v1/workbench/info
          test "$(docker exec hb-ci id -u)" = 10001
          python -m pip install httpx==0.28.1
          python scripts/check_docker_audit.py --out /tmp/docker-audit
          python scripts/check_image_sources.py --container hb-ci --out /tmp/docker-audit/image.json
          docker inspect hb-ci --format '{{json .HostConfig.NanoCpus}} {{json .HostConfig.Memory}}'
          docker logs hb-ci > /tmp/docker-audit/container.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-audit
          path: /tmp/docker-audit

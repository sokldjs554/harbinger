name: Publish verified AWS deployment evidence
on:
  push:
    branches: [docs/aws-live-evidence]
    paths: [.github/workflows/aws-publish-evidence.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af6834
        with:
          ref: docs/aws-live-evidence
      - name: Download original verified deployment artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/sokldjs554/harbinger/actions/artifacts/12516181112/zip > /tmp/harbinger-aws.zip
      - name: Verify archive and copy exact source evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          expected='69e577678894b7f6eadb583aef3c7ee221af14a56eb7f13f394e811d5c1638fb'
          raw=Path('/tmp/harbinger-aws.zip').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==expected
          z=zipfile.ZipFile('/tmp/harbinger-aws.zip')
          assert z.testzip() is None
          dest=Path('docs/verification/aws')
          dest.mkdir(parents=True,exist_ok=True)
          for src,out in [('deployment.json','deployment.json'),('deployment-result.json','deployment-result.json'),('browser/checks.json','browser-checks.json')]:
              (dest/out).write_bytes(z.read(src))
          for name in ['list.png','mobile-list.png','mobile-detail.png','upload-error.png']:
              (dest/name).write_bytes(z.read('browser/'+name))
          (dest/'runtime').mkdir(exist_ok=True)
          for name in ['ablation','calibration','energy','importance','metrics','patrol','signals','survival']:
              (dest/'runtime'/f'{name}.json').write_bytes(z.read('runtime/artifacts/'+name+'.json'))
          videos=[n for n in z.namelist() if n.startswith('browser/video/') and n.endswith('.webm')]
          assert len(videos)==1
          Path('/tmp/harbinger-aws-source.webm').write_bytes(z.read(videos[0]))
          meta=json.loads((dest/'deployment.json').read_text())
          result=json.loads((dest/'deployment-result.json').read_text())
          metrics=json.loads((dest/'runtime/metrics.json').read_text())
          checks=json.loads((dest/'browser-checks.json').read_text())
          assert meta['commit']==result['commit']=='5e54df21b6b7c31473689526c20b0e7881e75dee'
          assert meta['model_version']==metrics['bundle_version']=='v20261023-161741'
          assert checks['static'] is False and not checks['page_errors']
          assert all(result[k] for k in ['browser_verified','reboot_verified','renewal_dry_run','ssh_closed'])
          print('Original ZIP digest, CRC, source/model versions and browser/reboot/renewal/SSH checks verified.')
          PY
      - name: Encode original 33-second browser recording
        run: |
          if ! command -v ffmpeg >/dev/null; then
            bash scripts/configure_ci_apt.sh
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y -i /tmp/harbinger-aws-source.webm -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p -movflags +faststart -an docs/demo/aws-checks.mp4
          ffmpeg -v error -i docs/demo/aws-checks.mp4 -f null -
      - name: Recheck public HTTPS and validate documentation
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,re,subprocess,urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          dest=Path('docs/verification/aws')
          result=json.loads((dest/'deployment-result.json').read_text())
          target=urlsplit(result['url'])
          assert target.scheme=='https' and target.netloc=='13.236.137.0'
          response={}
          for name,path in [('health','/health'),('provenance','/deployment.json'),('workbench','/v1/workbench/info')]:
              with urllib.request.urlopen('https://'+target.netloc+path,timeout=20) as r:
                  assert r.status==200
                  response[name]=json.load(r)
          assert response['provenance']['commit']==result['commit']
          assert response['workbench']['mode']=='live'
          assert response['workbench']['model_version']=='v20261023-161741'
          response.update(verified_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),workflow_run=int(os.environ['GITHUB_RUN_ID']),tls='urllib.request default certificate and hostname verification')
          (dest/'public-https.json').write_text(json.dumps(response,ensure_ascii=False,indent=2)+'\n')
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size','-show_entries','stream=width,height,codec_name','-of','json','docs/demo/aws-checks.mp4'],text=True))
          assert abs(float(probe['format']['duration'])-33.16)<0.2
          original=Path('/tmp/harbinger-aws-source.webm')
          video=Path('docs/demo/aws-checks.mp4')
          recording={'source_workflow_run':39983662792,'source_artifact_id':12516181112,'source_artifact_sha256':'69e577678894b7f6eadb583aef3c7ee221af14a56eb7f13f394e811d5c1638fb','original_video_sha256':hashlib.sha256(original.read_bytes()).hexdigest(),'published_video_sha256':hashlib.sha256(video.read_bytes()).hexdigest(),'transcode':'libx264 CRF24, yuv420p, faststart; same frames and duration, no audio','probe':probe}
          (dest/'recording.json').write_text(json.dumps(recording,ensure_ascii=False,indent=2)+'\n')
          files=[p for p in dest.rglob('*') if p.is_file() and p.name not in {'README.md','sha256.json'}]+[video]
          (dest/'sha256.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(files)},indent=2)+'\n')
          docs=['README.md','docs/running.md','docs/submission.md','docs/verification/README.md','deploy/aws/README.md','docs/verification/aws/README.md']
          for name in docs:
              p=Path(name)
              for link in re.findall(r'!?\[[^\]]*\]\(([^\s)]+)\)',p.read_text()):
                  if link.startswith(('http:','https:','mailto:','#')):continue
                  assert (p.parent/unquote(link.split('#')[0])).resolve().exists(),(name,link)
          assert Path('README.md').read_text().count('<!-- num:')==27
          print('Trusted public HTTPS, provenance, 33-second recording and document links verified.')
          PY
          python3 scripts/fill_numbers.py --check
          python3 scripts/release_manifest.py --check
          git diff --check
      - name: Commit evidence to the documentation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/aws docs/demo/aws-checks.mp4
          git commit -m 'docs: preserve verified AWS screenshots, video and runtime evidence'
          git push origin HEAD:docs/aws-live-evidence
